services:
  ai-gateway:
    image: ${DIREXIO_AI_GATEWAY_IMAGE:-ghcr.io/yingsuiai/direxio-ai-gateway:agent-mvp}
    restart: unless-stopped
    environment:
      DIREXIO_AI_GATEWAY_HOST: 0.0.0.0
      DIREXIO_AI_GATEWAY_PORT: 8787
      DIREXIO_AI_GATEWAY_TOKENS: ${DIREXIO_AI_GATEWAY_TOKENS:?set Direxio AI gateway tokens}
      DIREXIO_AI_GATEWAY_MODEL_MODE: ${DIREXIO_AI_GATEWAY_MODEL_MODE:-openai-compatible}
      DIREXIO_MODEL_BASE_URL: ${DIREXIO_MODEL_BASE_URL:?set model provider base URL}
      DIREXIO_MODEL_API_KEY: ${DIREXIO_MODEL_API_KEY:?set model provider API key}
      DIREXIO_MODEL_NAME: ${DIREXIO_MODEL_NAME:-deepseek-chat}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_SEARCH_TIMEOUT_MS: ${TAVILY_SEARCH_TIMEOUT_MS:-12000}
      DIREXIO_SEARCH_REQUESTS_PER_MINUTE: ${DIREXIO_SEARCH_REQUESTS_PER_MINUTE:-60}
    ports:
      - "${DIREXIO_AI_GATEWAY_PORT:-8787}:8787"
